# Synthetic Canadian Insurance customers: three branch exports and their union.
definition_version: 1
id: insurance
defaults:
  seed: 20260916
  as_of_date: '2026-09-16'
schemas:
  customers:
    columns:
      - {name: id_client, type: string, generate: {kind: insurance, field: id_client, group: customer}}
      - {name: civilite, type: string, generate: {kind: insurance, field: civilite, group: customer}}
      - {name: prenom, type: string, generate: {kind: insurance, field: prenom, group: customer}}
      - {name: nom, type: string, generate: {kind: insurance, field: nom, group: customer}}
      - {name: date_naissance, type: string, generate: {kind: insurance, field: date_naissance, group: customer}}
      - {name: sexe, type: string, generate: {kind: insurance, field: sexe, group: customer}}
      - {name: langue_preferee, type: string, generate: {kind: insurance, field: langue_preferee, group: customer}}
      - {name: numero_voie, type: string, generate: {kind: insurance, field: numero_voie, group: customer}}
      - {name: type_voie, type: string, generate: {kind: insurance, field: type_voie, group: customer}}
      - {name: nom_voie, type: string, generate: {kind: insurance, field: nom_voie, group: customer}}
      - {name: orientation, type: string, generate: {kind: insurance, field: orientation, group: customer}}
      - {name: appartement, type: string, generate: {kind: insurance, field: appartement, group: customer}}
      - {name: ville, type: string, generate: {kind: insurance, field: ville, group: customer}}
      - {name: province_code, type: string, generate: {kind: insurance, field: province_code, group: customer}}
      - {name: province_nom, type: string, generate: {kind: insurance, field: province_nom, group: customer}}
      - {name: code_postal, type: string, generate: {kind: insurance, field: code_postal, group: customer}}
      - {name: pays_code, type: string, generate: {kind: insurance, field: pays_code, group: customer}}
      - {name: courriel, type: string, generate: {kind: insurance, field: courriel, group: customer}}
      - {name: telephone, type: string, generate: {kind: insurance, field: telephone, group: customer}}
      - {name: id_contrat, type: string, generate: {kind: insurance, field: id_contrat, group: customer}}
      - {name: type_contrat, type: string, generate: {kind: insurance, field: type_contrat, group: customer}}
      - {name: date_debut, type: string, generate: {kind: insurance, field: date_debut, group: customer}}
      - {name: date_fin, type: string, generate: {kind: insurance, field: date_fin, group: customer}}
      - {name: statut_contrat, type: string, generate: {kind: insurance, field: statut_contrat, group: customer}}
      - {name: prime_annuelle, type: string, generate: {kind: insurance, field: prime_annuelle, group: customer}}
      - {name: frequence_paiement, type: string, generate: {kind: insurance, field: frequence_paiement, group: customer}}
      - {name: mode_paiement, type: string, generate: {kind: insurance, field: mode_paiement, group: customer}}
      - {name: agence_code, type: string, generate: {kind: insurance, field: agence_code, group: customer}}
      - {name: date_creation, type: string, generate: {kind: insurance, field: date_creation, group: customer}}
      - {name: date_modification, type: string, generate: {kind: insurance, field: date_modification, group: customer}}
      - {name: date_reclamation, type: string, generate: {kind: insurance, field: date_reclamation, group: customer}}
      - {name: montant_reclamation, type: string, generate: {kind: insurance, field: montant_reclamation, group: customer}}
      - {name: reclamation_status, type: string, generate: {kind: insurance, field: reclamation_status, group: customer}}
datasets:
  - id: insurance-principal
    schema: customers
    rows: 200000
    source: principal
  - id: insurance-ontario
    schema: customers
    rows: 25000
    source: ontario
  - id: insurance-quebec
    schema: customers
    rows: 50000
    source: quebec
  - id: insurance-combined
    combine:
      inputs: [insurance-principal, insurance-ontario, insurance-quebec]
      source_column: filiale
anomaly_profiles:
  - id: dirty_realistic
    targets: [insurance-combined]
    operations:
      - {kind: set_missing, column: courriel, rate: 0.04}
      - {kind: duplicate, column: courriel, rate: 0.02}
      - {kind: format, column: telephone, value: phone_spaces, rate: 0.05}
      - {kind: set_missing, column: code_postal, rate: 0.02}
      - {kind: replace, column: pays_code, value: Canada, rate: 0.02}
      - {kind: format, column: type_contrat, value: upper, rate: 0.03}
      - {kind: set_missing, column: prime_annuelle, rate: 0.01}
      - {kind: format, column: nom, value: upper, rate: 0.02}
