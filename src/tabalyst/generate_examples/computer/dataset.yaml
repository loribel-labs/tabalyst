format: tabalyst.generate.package
format_version: "0.1.0"
id: mini_computer
package_version: "0.1.0"
catalog: catalog.yaml
defaults: {rows: 10, seed: 42, as_of_date: "2026-09-30"}
generation_profiles:
  balanced: {}
  consumer: {}
  business: {}
  gaming: {}
  creator: {}
  workstation: {}
  enterprise: {}
  mixed: {}
  portable_only: {}
anomaly_profiles:
  dirty_realistic:
    targets: [computers]
    operations:
      - {kind: set_missing, column: memory_gb, rate: 0.025}
      - {kind: set_missing, column: cpu_model, rate: 0.015}
      - {kind: format, column: release_date, value: date_slash, rate: 0.02}
      - {kind: replace, column: current_price, value: "N/A", rate: 0.01}
      - {kind: replace, column: stock_status, value: in_stok, rate: 0.015}
      - {kind: replace, column: gpu_vram_gb, value: "0", rate: 0.04,
         when: {gpu_type: dedicated}}
      - {kind: replace, column: stock_quantity, value: "0", rate: 0.03,
         when: {stock_status: in_stock}}
  dirty_stress:
    targets: [computers]
    operations:
      - {kind: set_missing, column: memory_gb, rate: 0.12}
      - {kind: set_missing, column: cpu_model, rate: 0.08}
      - {kind: format, column: release_date, value: date_slash, rate: 0.10}
      - {kind: replace, column: current_price, value: "N/A", rate: 0.06}
      - {kind: replace, column: stock_status, value: in_stok, rate: 0.08}
      - {kind: replace, column: gpu_vram_gb, value: "0", rate: 0.18,
         when: {gpu_type: dedicated}}
      - {kind: replace, column: stock_quantity, value: "0", rate: 0.15,
         when: {stock_status: in_stock}}
  unit_variants:
    targets: [computers]
    operations:
      - {kind: format, column: memory_gb, value: unit_gb, rate: 0.08}
      - {kind: format, column: storage_gb, value: unit_gb, rate: 0.05}
      - {kind: format, column: gpu_vram_gb, value: unit_gb, rate: 0.03}
  unit_variants_extended:
    targets: [computers]
    operations:
      - {kind: format, column: memory_gb, value: unit_suffix, rate: 0.08}
      - {kind: format, column: storage_gb, value: unit_suffix, rate: 0.05}
      - {kind: format, column: gpu_vram_gb, value: unit_suffix, rate: 0.03}
      - {kind: format, column: cpu_max_clock_ghz, value: unit_suffix, rate: 0.04}
      - {kind: format, column: display_size_in, value: unit_suffix, rate: 0.04}
      - {kind: format, column: display_refresh_rate_hz, value: unit_suffix, rate: 0.03}
      - {kind: format, column: display_brightness_nits, value: unit_suffix, rate: 0.02}
      - {kind: format, column: npu_tops, value: unit_suffix, rate: 0.02}
      - {kind: format, column: battery_wh, value: unit_suffix, rate: 0.03}
      - {kind: format, column: power_adapter_w, value: unit_suffix, rate: 0.03}
      - {kind: format, column: weight_kg, value: unit_suffix, rate: 0.04}
      - {kind: format, column: width_mm, value: unit_suffix, rate: 0.02}
      - {kind: format, column: depth_mm, value: unit_suffix, rate: 0.02}
      - {kind: format, column: height_mm, value: unit_suffix, rate: 0.02}
output_profiles:
  compact: [product_id, sku, brand, product_family, model, generation, model_year, computer_type, form_factor, product_segment, cpu_brand, cpu_family, cpu_model, cpu_cores, cpu_threads, gpu_brand, gpu_family, gpu_model, gpu_type, gpu_vram_gb, memory_type, memory_gb, storage_type, storage_gb, display_size_in, display_type, display_resolution, display_refresh_rate_hz, operating_system, color, weight_kg, currency, list_price, current_price, stock_quantity, stock_status, release_date, rating, review_count, market]
  standard: [product_id, sku, mpn, brand, product_family, model, generation,
    model_year, computer_type, form_factor, product_segment, product_category,
    product_subcategory, cpu_brand, cpu_family, cpu_model, cpu_architecture,
    cpu_cores, cpu_threads, cpu_max_clock_ghz, gpu_brand, gpu_family, gpu_model,
    gpu_type, gpu_vram_gb, memory_type, memory_gb, storage_type, storage_gb,
    display_size_in, display_type, display_resolution, display_refresh_rate_hz,
    display_brightness_nits, display_touch, display_finish, os_family,
    operating_system, npu_tops, ai_pc_class, wifi_standard, bluetooth_version,
    ethernet_speed, usb_a_ports, usb_c_ports, hdmi_ports, battery_wh,
    power_adapter_w, color, weight_kg, chassis_material, camera_type,
    keyboard_layout, biometric_type, currency, list_price, current_price,
    discount_percent, price_tier, condition, stock_quantity, stock_status,
    warranty_period, release_date, product_age_months,
    product_lifecycle_status, rating, review_count, market, language]
  extended: [product_id, sku, mpn, brand, product_family, model, generation,
    model_year, computer_type, form_factor, product_segment, product_category,
    product_subcategory, cpu_brand, cpu_family, cpu_model, cpu_architecture,
    cpu_cores, cpu_threads, cpu_max_clock_ghz, gpu_brand, gpu_family, gpu_model,
    gpu_type, gpu_vram_gb, memory_type, memory_gb, storage_type, storage_gb,
    display_size_in, display_type, display_resolution, display_refresh_rate_hz,
    display_brightness_nits, display_aspect_ratio, display_touch, display_finish,
    display_hdr, display_color_gamut, os_family, operating_system, npu_brand,
    npu_family, npu_tops, ai_pc_class, copilot_plus_pc, wifi_standard,
    bluetooth_version, ethernet_speed, cellular_type, docking_support,
    usb_a_ports, usb_c_ports, thunderbolt_ports, hdmi_ports, displayport_ports,
    ethernet_port, card_reader_type, memory_slots_total, memory_slots_used,
    m2_slots_total, m2_slots_used, upgradeability_level, battery_wh,
    power_adapter_w, color, weight_kg, width_mm, depth_mm, height_mm,
    chassis_material, chassis_finish, camera_type, microphone_type,
    speaker_configuration, keyboard_type, keyboard_layout, biometric_type,
    trusted_platform, currency, list_price, current_price, discount_percent,
    price_tier, condition, stock_quantity, stock_status, warranty_period,
    promotion_type, promotion_status, lowest_price_30d, highest_price_30d,
    average_price_30d, price_change_30d_percent, release_date,
    product_age_months, product_generation, product_lifecycle_status, rating,
    review_count, popularity_level, sales_rank, units_sold_30d,
    conversion_rate, return_rate, market, language, seller, seller_type,
    warehouse, shipping_availability]
datasets:
  - id: computers
    mode: generated
    row_source: catalog_steps
    schema: schemas/computers.yaml
    steps:
      - id: select_type
        kind: select
        output: computer_type_id
        source: computer_type
        candidate_column: id
        weight_column: weight
        influences:
          - source: generation_profile_computer_type
            candidate_column: computer_type_id
            where: {generation_profile_id: generation_profile_id}
      - id: select_segment
        kind: select
        output: product_segment_id
        source: computer_type_product_segment
        candidate_column: product_segment_id
        where: {computer_type_id: computer_type_id}
        influences:
          - source: generation_profile_segment
            candidate_column: product_segment_id
            where: {generation_profile_id: generation_profile_id}
      - id: select_brand
        kind: select
        output: brand_id
        source: product_segment_brand
        candidate_column: brand_id
        where: {product_segment_id: product_segment_id}
      - id: select_family
        kind: select
        output: product_family_id
        source: product_family
        candidate_column: id
        where: {brand_id: brand_id}
        filters:
          - source: product_family_computer_type
            candidate_column: product_family_id
            where: {computer_type_id: computer_type_id}
          - source: product_family_product_segment
            candidate_column: product_family_id
            where: {product_segment_id: product_segment_id}
      - id: select_model
        kind: select
        output: product_model_id
        source: product_model
        candidate_column: id
        where: {product_family_id: product_family_id}
      - id: select_generation
        kind: select
        output: generation_id
        source: model_generation
        candidate_column: id
        where: {product_model_id: product_model_id}
      - id: select_form_factor
        kind: select
        output: form_factor_id
        source: model_form_factor
        candidate_column: form_factor_id
        where: {product_model_id: product_model_id}
        filters:
          - source: computer_type_form_factor
            candidate_column: form_factor_id
            where: {computer_type_id: computer_type_id}
      - id: select_cpu
        kind: select
        output: cpu_id
        source: generation_cpu
        candidate_column: cpu_id
        where: {generation_id: generation_id}
        weight_column: weight
      - id: select_gpu
        kind: select
        output: gpu_id
        source: generation_gpu
        candidate_column: gpu_id
        where: {generation_id: generation_id}
        weight_column: weight
      - id: select_memory
        kind: select
        output: memory_id
        source: generation_memory
        candidate_column: memory_id
        where: {generation_id: generation_id}
        weight_column: weight
        influences:
          - source: cpu_memory_weight
            candidate_column: memory_id
            where: {cpu_id: cpu_id}
          - source: gpu_memory_weight
            candidate_column: memory_id
            where: {gpu_id: gpu_id}
          - source: product_segment_memory_weight
            candidate_column: memory_id
            where: {product_segment_id: product_segment_id}
      - id: select_storage
        kind: select
        output: storage_id
        source: generation_storage
        candidate_column: storage_id
        where: {generation_id: generation_id}
        weight_column: weight
        influences:
          - source: gpu_storage_weight
            candidate_column: storage_id
            where: {gpu_id: gpu_id}
          - source: product_segment_storage_weight
            candidate_column: storage_id
            where: {product_segment_id: product_segment_id}
      - id: select_display
        kind: select
        output: display_id
        source: generation_display
        candidate_column: display_id
        where: {generation_id: generation_id}
        weight_column: weight
        influences:
          - source: product_segment_display_weight
            candidate_column: display_id
            where: {product_segment_id: product_segment_id}
        filters:
          - source: gpu_display
            candidate_column: display_id
            where: {gpu_id: gpu_id}
      - id: select_operating_system
        kind: select
        output: operating_system_id
        source: generation_operating_system
        candidate_column: operating_system_id
        where: {generation_id: generation_id}
        weight_column: weight
        filters:
          - source: cpu_operating_system
            candidate_column: operating_system_id
            where: {cpu_id: cpu_id}
      - id: select_color
        kind: select
        output: color_id
        source: generation_color
        candidate_column: color_id
        where: {generation_id: generation_id}
        weight_column: weight
