  # Rare events of Insurance V2 (contract docs/dev/generate/insurance-v2.md 6.2): one scenario
  # per case, exact counts that do not follow the file size, 34 columns. Below min_rows the
  # run is refused: a 500-case scenario must stay at 0.5 percent of the file at most.
  rare_events:
    targets:
    - insurance-combined
    min_rows: 100000
    operations:
    - kind: reuse_value
      column: id_contrat
      count: 1
      scenario_id: R01
      rule_id: M21
      category: business_rule_violation
      severity: critical
      rarity_level: single
      expected_detection: uniqueness
      description: A contract identifier reused on a second contract
    - kind: format
      column: date_naissance
      value: date_plus_century
      count: 5
      scenario_id: R02
      rule_id: M04
      category: semantic_invalid
      severity: major
      rarity_level: extremely_rare
      expected_detection: domain
      description: A birth date a century later, so in the future
    - kind: replace
      column: montant_indemnise
      value: "-500.00"
      count: 5
      when: {reclamation_status: "fermé"}
      scenario_id: R03
      rule_id: M10
      category: semantic_invalid
      severity: major
      rarity_level: extremely_rare
      expected_detection: domain
      description: A negative indemnity amount
    - kind: format
      column: date_sinistre
      value: date_minus_decade
      count: 10
      when: {reclamation_status: "fermé"}
      scenario_id: R04
      rule_id: M08
      category: business_rule_violation
      severity: major
      rarity_level: very_rare
      expected_detection: cross_column
      description: A claim event date preceding the contract start date
    - kind: format
      column: prime_annuelle
      value: times_100
      count: 20
      scenario_id: R05
      category: semantic_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: statistical
      description: An annual premium multiplied by 100
    - kind: format
      column: date_debut
      value: date_dmy
      count: 10
      when: {filiale: "principal"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: date_debut
      value: date_mdy_iso
      count: 8
      when: {filiale: "ontario"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: date_debut
      value: date_iso
      count: 7
      when: {filiale: "quebec"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: code_postal
      value: postal_other_province
      count: 50
      requires: [province_code]
      scenario_id: R07
      rule_id: M19
      category: business_rule_violation
      severity: major
      rarity_level: very_rare
      expected_detection: cross_column
      description: A postal code of another province than the customer's
    - kind: swap
      column: date_debut
      value: date_fin
      count: 50
      when: {date_reclamation: ""}
      scenario_id: R08
      rule_id: M01
      category: business_rule_violation
      severity: major
      rarity_level: very_rare
      expected_detection: cross_column
      description: A contract ending before it starts
    - kind: replace
