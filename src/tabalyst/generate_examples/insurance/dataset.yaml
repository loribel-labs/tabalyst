      count: 10
      when: {filiale: "principal"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: date_debut
      value: date_mdy_iso
      count: 8
      when: {filiale: "ontario"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: date_debut
      value: date_iso
      count: 7
      when: {filiale: "quebec"}
      scenario_id: R06
      category: contextual_invalid
      severity: major
      rarity_level: very_rare
      expected_detection: contextual
      description: A start date written in the convention of another branch
    - kind: format
      column: code_postal
      value: postal_other_province
      count: 50
      requires: [province_code]
      scenario_id: R07
      rule_id: M19
      category: business_rule_violation
      severity: major
      rarity_level: very_rare
      expected_detection: cross_column
      description: A postal code of another province than the customer's
    - kind: swap
      column: date_debut
      value: date_fin
      count: 50
      when: {date_reclamation: ""}
      scenario_id: R08
      rule_id: M01
      category: business_rule_violation
      severity: major
      rarity_level: very_rare
      expected_detection: cross_column
      description: A contract ending before it starts
    - kind: replace
