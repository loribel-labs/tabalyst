# Synthetic Canadian CRM Contacts & Accounts demo (Generate lot 5).
definition_version: 1
id: crm
defaults:
  seed: 42
  as_of_date: '2026-09-30'
cohorts:
  - id: contact_only
    weight: 64
    values: {opportunity_stage: None}
  - id: pipeline
    weight: 36
entities:
  - id: accounts
    count: 400
    generator: company
    columns:
      - {name: company_id, type: string, generate: {kind: sequence, prefix: A, width: 5}}
      - {name: company_name, type: string, generate: {kind: sequence, prefix: 'Cedarline Group ', width: 4}}
      - {name: industry, type: string, generate: {kind: choice, weights: {Software: 18, Manufacturing: 15, Retail: 14, Healthcare: 12, Professional Services: 12, Finance: 9, Logistics: 8, Education: 7, Hospitality: 5}}}
      - {name: company_size, type: string, generate: {kind: choice, weights: {'1-10': 18, '11-50': 34, '51-200': 27, '201-1000': 16, '1001+': 5}}}
      - {name: country, type: string, generate: {kind: constant, value: Canada}}
      - {name: city, type: string, generate: {kind: common, provider: address, group: account_address, field: city}}
      - {name: province_code, type: string, generate: {kind: common, provider: address, group: account_address, field: province_code}}
      - {name: postal_code, type: string, generate: {kind: common, provider: address, group: account_address, field: postal_code}}
datasets:
  - id: crm-contacts
    rows: 20000
    columns:
      - {name: contact_id, type: string, generate: {kind: sequence, prefix: C, width: 6}}
      - {name: first_name, type: string, generate: {kind: common, provider: person, group: person, field: first_name, profile: mixed}}
      - {name: family_name, type: string, generate: {kind: common, provider: person, group: person, field: family_name, profile: mixed}}
      - {name: person_language, type: string, generate: {kind: common, provider: person, group: person, field: language, profile: mixed}}
      - {name: company_id, type: string, generate: {kind: reference, entity: accounts, field: company_id}}
      - {name: company_name, type: string, generate: {kind: reference, entity: accounts, field: company_name}}
      - {name: industry, type: string, generate: {kind: reference, entity: accounts, field: industry}}
      - {name: company_size, type: string, generate: {kind: reference, entity: accounts, field: company_size}}
      - {name: country, type: string, generate: {kind: reference, entity: accounts, field: country}}
      - {name: city, type: string, generate: {kind: reference, entity: accounts, field: city}}
      - {name: province_code, type: string, generate: {kind: reference, entity: accounts, field: province_code}}
      - {name: postal_code, type: string, generate: {kind: reference, entity: accounts, field: postal_code}}
      - {name: email, type: string, depends_on: [first_name, family_name, province_code, person_language], generate: {kind: common, provider: contact, group: contact, field: email, first: first_name, last: family_name, province: province_code, language: person_language}, missing: 0.02}
      - {name: phone, type: string, depends_on: [first_name, family_name, province_code, person_language], generate: {kind: common, provider: contact, group: contact, field: phone, first: first_name, last: family_name, province: province_code, language: person_language}, missing: 0.03}
      - {name: job_title, type: string, generate: {kind: choice, weights: {Manager: 25, Director: 15, Coordinator: 18, Analyst: 17, Specialist: 15, Executive: 10}}}
      - {name: lead_source, type: string, generate: {kind: choice, weights: {Website: 33, Referral: 27, Event: 16, Partner: 14, Outbound: 10}}}
      - {name: lifecycle_stage, type: string, generate: {kind: choice, weights: {Lead: 37, Qualified: 25, Opportunity: 22, Customer: 16}}}
      - {name: lead_status, type: string, depends_on: [lifecycle_stage], generate: {kind: conditional, from: lifecycle_stage, cases: {Lead: New, Qualified: Working, Opportunity: Negotiating, Customer: Converted}, default: Unknown}}
      - {name: owner, type: string, generate: {kind: choice, weights: {Alex Chen: 1, Morgan Lee: 1, Sam Patel: 1, Taylor Roy: 1, Jordan Tremblay: 1}}, missing: 0.01}
      - {name: marketing_opt_in, type: boolean, generate: {kind: boolean}}
      - {name: created_at, type: date, generate: {kind: date, min: '2019-01-01', max: '2026-06-30'}}
      - {name: last_activity_at, type: date, generate: {kind: date, min: '2021-01-01', max: '2026-09-30'}, missing: 0.11}
      - {name: opportunity_stage, type: string, generate: {kind: choice, weights: {Discovery: 12, Proposal: 11, Negotiation: 7, Closed Won: 4, Closed Lost: 2}}}
      - {name: opportunity_amount, type: decimal, cohort: pipeline, generate: {kind: decimal, min: 1500, max: 175000, scale: 2}, missing: 0.08}
      - {name: opportunity_probability, type: integer, cohort: pipeline, generate: {kind: integer, min: 0, max: 100}, missing: 0.03}
      - {name: opportunity_close_date, type: date, cohort: pipeline, generate: {kind: date, min: '2024-01-01', max: '2027-09-30'}, missing: 0.04}
anomaly_profiles:
  - id: dirty_realistic
    targets: [crm-contacts]
    operations:
      - {kind: set_missing, column: email, rate: 0.06}
      - {kind: duplicate, column: email, rate: 0.02}
      - {kind: replace, column: email, value: 'invalid-address', rate: 0.01}
      - {kind: set_missing, column: phone, rate: 0.05}
      - {kind: format, column: phone, value: phone_spaces, rate: 0.12}
      - {kind: format, column: company_name, value: upper, rate: 0.03}
      - {kind: replace, column: country, value: CA, rate: 0.06}
      - {kind: format, column: industry, value: lower, rate: 0.04}
      - {kind: format, column: lead_source, value: lower, rate: 0.04}
      - {kind: set_missing, column: opportunity_amount, rate: 0.04, when: {opportunity_stage: Proposal}}
      - {kind: replace, column: opportunity_probability, value: '120', rate: 0.01, when: {opportunity_stage: Closed Won}}
