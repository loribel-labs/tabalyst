name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Require the compiled ijson backend
        run: python -c "import ijson; assert ijson.backend == 'yajl2_c', ijson.backend"
      - run: python -m pytest
      - run: python -m ruff check .

  storage-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Require a binary DuckDB wheel
        run: 'python -m pip install --only-binary=:all: duckdb==1.5.5'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_project_database.py tests/test_project_generations.py tests/test_project_queries.py tests/test_project_cache.py tests/test_project_sessions.py tests/test_project_rescan.py tests/test_project_open_service.py tests/test_project_store.py tests/test_project_index.py tests/test_project_scan.py tests/test_source_freshness.py

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the installed wheel outside the repository
        shell: bash
        run: |
          wheel_path=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          python -m venv "$RUNNER_TEMP/tabalyst-wheel"
          "$RUNNER_TEMP/tabalyst-wheel/bin/python" -m pip install "$wheel_path"
          mkdir -p "$RUNNER_TEMP/tabalyst-smoke"
          cd "$RUNNER_TEMP/tabalyst-smoke"
          printf 'id,name\n1,Alice\n2,Bob\n' > sample.csv
          "$RUNNER_TEMP/tabalyst-wheel/bin/python" -c "import importlib.metadata as metadata; import tabalyst; assert tabalyst.__version__ == metadata.version('tabalyst'); tabalyst.analyze('sample.csv', 'api/report.html')"
          package_version=$("$RUNNER_TEMP/tabalyst-wheel/bin/python" -c "import tabalyst; print(tabalyst.__version__)")
          "$RUNNER_TEMP/tabalyst-wheel/bin/tabalyst" report sample.csv -o cli/report.html
          test -f api/report.json
          test -f api/executions.json
          test -f cli/report.json
          test -f cli/executions.json
          grep -q ">v$package_version<" api/report.html
          grep -q 'tabalyst-theme' api/report.html
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
