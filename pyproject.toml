[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabalyst"
version = "0.1.2"
description = "Open-source toolkit for understanding and working with unfamiliar data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gregory Borelli" },
]
keywords = [
    "csv",
    "data-analysis",
    "data-profiling",
    "data-quality",
    "eda",
    "html-report",
    "json",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "jinja2>=3.1",
    "pandas>=2.2",
    "pydantic>=2.10",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
]

[project.scripts]
tabalyst = "tabalyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabalyst = ["templates/*.html", "static/*.css", "static/*.js"]

[project.urls]
Homepage = "https://github.com/loribel-labs/tabalyst"
Repository = "https://github.com/loribel-labs/tabalyst.git"
Issues = "https://github.com/loribel-labs/tabalyst/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
