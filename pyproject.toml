[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabalyst"
version = "0.6.2"
description = "Open-source toolkit for understanding and working with unfamiliar data."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    { name = "Gregory Borelli" },
]
keywords = [
    "csv",
    "data-analysis",
    "data-profiling",
    "data-quality",
    "eda",
    "html-report",
    "json",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb==1.5.5",
    "ijson>=3.3",
    "jinja2>=3.1",
    "platformdirs>=4",
    "pydantic>=2.11",
    "python-calamine>=0.8",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "xlsxwriter>=3",
]

[project.scripts]
tabalyst = "tabalyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tabalyst = ["templates/*.html", "static/*.css", "static/*.js", "generate_examples/*.yaml", "generate_resources/**/*.csv", "generate_resources/*.md"]

[project.urls]
Homepage = "https://github.com/loribel-labs/tabalyst"
Repository = "https://github.com/loribel-labs/tabalyst.git"
Issues = "https://github.com/loribel-labs/tabalyst/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "lot(name): Tabalyst Scan implementation lot that provides the tested behavior",
    "inspect_lot(name): Tabalyst Inspect implementation lot that provides the tested behavior",
]

[tool.ruff]
line-length = 88
target-version = "py311"
