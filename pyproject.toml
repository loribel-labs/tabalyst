[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabalyst"
version = "0.7.2"
description = "Open-source toolkit for understanding and working with unfamiliar data."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    { name = "Gregory Borelli" },
]
keywords = [
    "csv",
    "data-analysis",
    "data-profiling",
    "data-quality",
    "eda",
    "html-report",
    "json",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "duckdb==1.5.5",
    "ijson>=3.3",
    "jinja2>=3.1",
    "platformdirs>=4",
    "pydantic>=2.11",
    "python-calamine>=0.8",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "jsonschema>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "xlsxwriter>=3",
]

[project.scripts]
tabalyst = "tabalyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tabalyst.generate_examples.computer.data", "tabalyst.generate_examples.computer_reference*"]

[tool.setuptools.package-data]
tabalyst = ["templates/*.html", "static/*.css", "static/*.js", "schemas/*.json", "generate_examples/crm/*.yaml", "generate_examples/crm/schemas/*.yaml", "generate_examples/insurance/*.yaml", "generate_examples/insurance/schemas/*.yaml", "generate_examples/insurance/data/*.csv", "generate_examples/insurance/*.md", "generate_examples/computer/*.yaml", "generate_examples/computer/*.md", "generate_examples/computer/schemas/*.yaml", "generate_examples/computer/data/*.csv", "generate_resources/**/*.csv", "generate_resources/*.md"]

[project.urls]
Homepage = "https://github.com/loribel-labs/tabalyst"
Repository = "https://github.com/loribel-labs/tabalyst.git"
Issues = "https://github.com/loribel-labs/tabalyst/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "lot(name): Tabalyst Scan implementation lot that provides the tested behavior",
    "scan_json_lot(name): Scan and JSON work lot (plan 2026-10-06) that provides the tested behavior; lot 0 tests describe current behavior",
    "report_lot(name): Report overview lot (plan 2026-10-16) that provides the tested behavior; skipped until the lot is enabled in tests/scan/report_gate.py",
    "inspect_lot(name): Tabalyst Inspect implementation lot that provides the tested behavior",
    "dedup_lot(name): Tabalyst Dedup implementation lot (plan 2026-10-22) that provides the tested behavior; skipped until the lot is enabled in tests/dedup/conftest.py",
    "dedup_t(*ids): requirement tests (T01 to T30 of the Dedup specification) that the test covers",
    "dedup_heavy: Dedup large-scale test, never run by default; select it with -m dedup_heavy",
    "uid_lot(name): Unique ID plan (2026-10-23) lot that provides the tested behavior; skipped until the lot is enabled in tests/report/conftest.py",
    "uid_t(*ids): requirement tests (T01 to T34 of the Unique ID specification) that the test covers",
    "shipped_exposure_default: the test reads the shipped default of scan.exposure.sensitive_values (show), not the masking default the suite runs with",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The naive instants of the date-order analysis are built on purpose; ruff 0.16 enables DTZ001 by
# default and ruff 0.17 does not, so the exemption lives here and not in a noqa comment.
"src/tabalyst/scanner/secondpass/orders.py" = ["DTZ001"]
"tests/scan/test_date_order.py" = ["DTZ001"]
